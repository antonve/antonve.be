# Serves the static Astro build with the URLs and statuses the Next.js server had.
server {
    listen 3000;
    root /srv/www;
    charset utf-8;
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/css image/svg+xml;

    error_page 404 /404.html;

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri.html =404;
    }

    # Hashed build assets never change.
    location ^~ /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Pages are only reachable at their extensionless URLs.
    location ~ \.html$ {
        internal;
    }

    location ~ ^/(index|404)$ {
        return 404;
    }

    # /projects/ -> /projects, like Next.js.
    location ~ ^(.+)/$ {
        return 308 $1$is_args$args;
    }
}
