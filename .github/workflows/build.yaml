name: build
on:
  push:
    branches: [master]
  pull_request:
jobs:
  build:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build project
        run: pnpm run build

      - name: Run browser smoke tests
        run: |
          docker run --rm --ipc=host \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            mcr.microsoft.com/playwright:v1.62.1-noble \
            bash -lc 'corepack enable && corepack prepare pnpm@10.30.3 --activate >/dev/null && pnpm run test:e2e'

      - name: Record production audit
        if: always()
        run: pnpm audit --prod --json > production-audit.json || true

      - name: Upload browser and audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: migration-baseline
          path: |
            playwright-report/
            test-results/
            production-audit.json
          if-no-files-found: ignore

  container:
    name: Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag antonve-site:test .

      - name: Smoke test non-root runtime
        run: |
          set -euo pipefail
          container_id=$(docker run --detach --publish 3000:3000 antonve-site:test)
          trap 'docker logs "$container_id" || true; docker rm --force "$container_id" >/dev/null || true' EXIT
          test "$(docker inspect --format '{{.Config.User}}' "$container_id")" = nextjs
          test "$(docker exec "$container_id" id -u)" = 1001
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          curl --fail --silent --show-error http://127.0.0.1:3000/projects >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/books >/dev/null
          missing_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/this-route-does-not-exist)
          test "$missing_status" = 404
          image_content_type=$(curl --fail --silent --show-error --output /dev/null --write-out '%{content_type}' 'http://127.0.0.1:3000/_next/image?url=%2Fimg%2Fprofile-pic.jpg&w=256&q=75')
          case "$image_content_type" in
            image/*) ;;
            *) echo "Unexpected image content type: $image_content_type"; exit 1 ;;
          esac

      - name: Save tested image
        if: github.ref == 'refs/heads/master'
        run: |
          set -o pipefail
          docker save antonve-site:test | gzip -1 > antonve-site-test.tar.gz

      - name: Upload tested image
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: production-image
          path: antonve-site-test.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish Image
    needs: [build, container]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Download tested image
        uses: actions/download-artifact@v8
        with:
          name: production-image

      - name: Load tested image
        run: gunzip --stdout antonve-site-test.tar.gz | docker load

      - name: Push images
        run: |
          # Setup credentials for GitHub packages
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u tadoku --password-stdin
          # Push images
          IMAGE_NAME=ghcr.io/antonve/antonve.be/web
          docker tag antonve-site:test $IMAGE_NAME:latest
          docker tag antonve-site:test $IMAGE_NAME:$GITHUB_SHA
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$GITHUB_SHA
