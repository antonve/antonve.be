name: build
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Build and check the production image
        run: docker build --label org.opencontainers.image.revision="$GITHUB_SHA" --tag antonve-site:test .

      - name: Install browser tooling and audit all dependencies
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            "mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble" \
            bash -lc 'corepack enable && pnpm install --frozen-lockfile --store-dir /tmp/pnpm-store && pnpm audit --json > dependency-audit.json'

      - name: Test the exact production image
        env:
          SITE_IMAGE: antonve-site:test
          TMPDIR: ${{ runner.temp }}
        run: bash tests/e2e/run.sh

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification
          path: |
            playwright-report/
            test-results/
            dependency-audit.json
          if-no-files-found: ignore

      - name: Save tested image
        if: github.ref == 'refs/heads/master'
        run: |
          set -o pipefail
          docker save antonve-site:test | gzip -1 > antonve-site-test.tar.gz

      - name: Upload tested image
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: production-image
          path: antonve-site-test.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish Image
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download tested image
        uses: actions/download-artifact@v8
        with:
          name: production-image

      - name: Load tested image
        run: gunzip --stdout antonve-site-test.tar.gz | docker load

      - name: Push images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          IMAGE_NAME=ghcr.io/antonve/antonve.be/web
          docker image inspect antonve-site:test --format '{{.Id}}'
          docker tag antonve-site:test "$IMAGE_NAME:prod"
          docker tag antonve-site:test "$IMAGE_NAME:latest"
          docker tag antonve-site:test "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:prod"
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$GITHUB_SHA"
